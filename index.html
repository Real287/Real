<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#12070d">
<meta name="description" content="MirrorMatch: an early preview of a consent-first lookalike app.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MirrorMatch">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<title>MirrorMatch</title>
</head><body>
<div id="app">
  <header id="top"></header>
  <main id="screen" tabindex="-1"></main>
  <nav id="nav" aria-label="Main"></nav>
</div>
<input id="file" type="file" accept="image/*" hidden>
<div id="toasts" aria-live="polite"></div>
<noscript><p style="padding:24px;color:#fff">MirrorMatch needs JavaScript to run.</p></noscript>
<script type="module" src="js/app.js"></script>
</body></html>
